{% extends "food/base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<h1>{{ page_title }}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save food</button>
    <a class="button secondary" href="{% url 'food_list' %}">Cancel</a>
</form>
{% endblock %}
